# 单节点部署模板；数据库仅容器网络可达，浏览器入口默认仅本机可达。
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: minio server /data
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.6.16
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:?Set MILVUS_ROOT_PASSWORD}
    volumes: [milvus_data:/var/lib/milvus]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env.rag
    ports: ["127.0.0.1:8000:8000"]
    volumes: [knowledge_data:/app/var]
    depends_on:
      milvus: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 2g
    stop_grace_period: 120s
    restart: unless-stopped
  web:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: [python, -m, streamlit, run, app.py, --server.address=0.0.0.0]
    environment:
      STUDYLENS_API_URL: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 1g
    restart: unless-stopped
volumes:
  etcd_data:
  minio_data:
  milvus_data:
  knowledge_data:
