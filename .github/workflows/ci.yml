name: StudyLens checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared base dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Core, page and security regression tests (no paid API)
        run: |
          python -B -m unittest discover -s tests -p "test_core.py" -v
          python -B -m unittest discover -s tests -p "test_app.py" -v
          python -B -m unittest discover -s tests -p "test_security.py" -v
      - name: Compare 30-question retrieval baseline
        run: python -B evaluate.py --output evaluation/ci_baseline.csv --summary evaluation/ci_baseline.json --check-baseline evaluation/baseline_2026-10-31.json --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-python-${{ matrix.python-version }}
          path: evaluation/ci_baseline.*
          if-no-files-found: ignore

  rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-rag.txt
            constraints-rag.txt
      - name: Install RAG service dependencies
        run: python -m pip install -r requirements-rag.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Install real OCR runtime for smoke test
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - name: All offline regression tests (no model costs)
        run: python -B -m unittest discover -s tests -v
      - name: Start ephemeral authenticated Milvus
        run: docker compose -f deploy/compose.milvus-test.yml up -d --wait --wait-timeout 300
      - name: Real Milvus integration (deterministic test embeddings)
        env:
          MILVUS_TEST_URI: http://127.0.0.1:19530
          MILVUS_TEST_TOKEN: root:Milvus
        run: python -B -m unittest discover -s tests -p "test_milvus_integration.py" -v
      - name: Build deployable service image
        run: docker build -f deploy/Dockerfile -t studylens:ci .
      - name: Non-root container and OCR startup smoke
        run: >-
          docker run --rm studylens:ci python -c
          "import os; from pathlib import Path; from studylens.api import app; from studylens.ocr import create_ocr_engine; assert os.geteuid() != 0; p=Path('/app/var/smoke.txt'); p.write_text('ok',encoding='utf-8'); p.unlink(); create_ocr_engine(); print('container startup passed')"
      - name: Show database diagnostics on failure
        if: failure()
        run: docker compose -f deploy/compose.milvus-test.yml logs --tail=100
      - name: Remove ephemeral CI containers
        if: always()
        run: docker compose -f deploy/compose.milvus-test.yml down -v
