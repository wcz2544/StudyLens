name: Deploy static site

# 把 web/ 的纯浏览器版本发布到 GitHub Pages。
# 仓库 Settings → Pages → Source 选择 "GitHub Actions" 后，站点地址为
# https://<用户名>.github.io/StudyLens/

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "scripts/export_web_fixtures.py"
      - "data/sample_notes/**"
      - "data/open_corpus/**"
      - "tests/static/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "scripts/export_web_fixtures.py"
      - "data/sample_notes/**"
      - "data/open_corpus/**"
      - "tests/static/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline retrieval dependency
        run: python -m pip install "scikit-learn==1.7.2"
      - name: Browser-side tests (parity with the Python baseline)
        run: node --test tests/static/core.test.mjs tests/static/model.test.mjs
      - name: Check parity fixtures are current
        run: python -B scripts/export_web_fixtures.py --check
      - name: Check bundled retrieval baseline
        run: python -B scripts/evaluate_bundled.py --check-baseline evaluation/bundled_baseline.json --summary evaluation/ci_bundled.json --csv evaluation/ci_bundled.csv
      - name: Build static site
        run: python -B scripts/build_site.py --output _site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
